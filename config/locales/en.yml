# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  hello: "Hello world"
  posts:
    index:
      title: "Posts"
      show_post: "Show this post"
      new_post: "New post"
    new:
      title: "New post"
      back_to_home: "Back to home"
    show:
      all_posts: "All posts"
      comments: "Comments"
    form:
      create_post: "Create post"
      title: "Title"
      title_hint: "5 to 255 characters"
      category: "Category"
      body: "Content"
      body_hint: "200 to 4000 characters"
      error_message: "Failed to create post. Please check the entered data"
      errors:
        prohibited: "%{count} errors prohibited this post from being saved:"
  post_comment:
    form:
      submit: "Leave a comment"
      placeholder: "Write your comment..."
    comment:
      reply: "Reply"
      reply_form:
        submit: "Leave a comment"
        placeholder: "Write your reply..."
  main:
    index:
      title: "Collective blog"
    post:
      likes: "Liked by %{count}"
    posts:
      create:
        success: "Post was successfully created."
      update:
        success: "Post was successfully updated."
      destroy:
        success: "Post was successfully destroyed."
      post:
        like: "Like"
        unlike: "Unlike"
        likes_count: "%{count} likes"
  likes:
    create:
      success: "Post was successfully liked."
      error: "Unable to like the post."
    destroy:
      success: "Like was successfully removed."
      error: "You can only remove your own likes."
    not_found: "Post not found."
  post_comments:
    create:
      success: "Comment was successfully created."
      error: "Unable to create comment."
  form:
    required: "Required field"
  activerecord:
    attributes:
      post_comment:
        content: "Comment"
      post:
        title: "Title"
        body: "Content"
    errors:
      models:
        post_comment:
          attributes:
            content:
              blank: "cannot be empty"
        post:
          attributes:
            title:
              blank: "cannot be blank"
              too_short: "must be at least 5 characters"
              too_long: "must be at most 255 characters"
            body:
              blank: "cannot be blank"
              too_short: "must be at least 200 characters"
              too_long: "must be at most 4000 characters"
  errors:
    messages:
      not_saved:
        one: "1 error prohibited this %{resource} from being saved:"
        other: "%{count} errors prohibited this %{resource} from being saved:"
  layout:
    header:
      new_post: "New post"
      sign_in: "Sign in"
      sign_up: "Sign up"
      sign_out: "Sign out"
